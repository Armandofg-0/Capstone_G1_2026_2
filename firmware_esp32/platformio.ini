; Ejecutor de la ESP32: el nucleo portable de ../src/firmware mas los drivers de esta placa
; (src/main.cpp). src/config.h se genera desde
; config/torreta.ini al compilar (gen_config.py). Compilar y grabar:
;   pio run -t upload        monitor: pio device monitor
[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = -I../src/firmware -O2
build_src_filter = +<*> +<../../src/firmware/*.c>
extra_scripts = pre:gen_config.py
