; Configuracion de la torreta.
;
; Forma de uso del programa:
;
;   torreta [--config archivo.ini] [seccion.clave=valor ...]
;
; Cada seccion.clave=valor escrito en la linea de comandos pisa lo que diga este archivo
; (si no se indica la seccion, se entiende que es [general]). Una clave que no aparezca
; queda con el valor por defecto del codigo, y una clave desconocida es un error (asi un
; error de tipeo no pasa inadvertido). Los comentarios empiezan con ; o #. Las rutas
; relativas se buscan primero en el directorio actual y despues en la raiz del proyecto.

[general]
; Modo de funcionamiento: "vivo" (el unico) corre en tiempo real sobre una fuente de
; video (seccion [vivo]).
modo = vivo
; Perfil de deteccion. "laser" es el puntero laser (se detecta con CFAR), "general" sigue con un
; KCF el recuadro que se marca en el dashboard ([seleccion]) y "objeto" es el
; avion de juguete (lo adquiere el detector de varianza temporal y lo sigue un KCF).
perfil = laser
; Archivo donde guardar un registro por cuadro, por ejemplo registro.csv. Si se deja
; vacio, no se escribe nada.
csv =

[camara]
; Intrinsecos pinhole: focales y punto principal (px), y resolucion.
; Provisional (2026-10-27, 21 fotos, RMS 3,57 px): recalibrar.
fu = 566.59
fv = 572.71
cu = 307.52
cv = 213.82
; Esquinas interiores del tablero de ajedrez para calibrar desde el dashboard.
tablero_cols = 6
tablero_filas = 9
ancho = 640
alto = 480
; Offset del centro optico respecto del eje de pan (m, informe: |lx| <= 2 cm).
lx = 0.02
; Exposicion y lectura de una fila del obturador rodante (s).
t_e = 0.01
t_fila = 4.5833333333333334e-05
; Ruido base del detector (px).
sigma0 = 1.5
; Tamano aparente del blanco (px): h_w = kw rho / a_z + bw, con ruido sigma_w. kw = f por la
; envergadura del avion de juguete (500 x 0.3 m).
kw = 150
bw = 0
sigma_w = 2

[laser]
; Canal de la imagen sobre el que se busca el laser. Puede ser gris, rojo, verde, azul,
; croma_rojo, croma_verde o croma_azul. Los "croma" destacan un color por encima de los
; otros dos, lo que conviene para un laser de color sobre un fondo claro.
canal = croma_rojo
; Poner en true si el blanco es mas oscuro que el fondo.
oscuro = false
; SNR minimo para adquirir el blanco buscando en la imagen completa.
umbral_adquisicion = 10
; SNR minimo dentro de la ventana de seguimiento (mas bajo: cuesta mas engancharse que
; mantenerse enganchado).
umbral_seguimiento = 3
; Altura minima del punto sobre el fondo (niveles del canal, 0 a 255), al adquirir y al seguir.
; El laser medido da ~69 en croma_rojo; una mancha rojiza del fondo, ~8. 0 = sin criterio.
contraste_min = 25
; Radio maximo del blanco, en px. Lo que sea mas ancho (lamparas, bordes brillantes) se
; descarta.
radio_blob_max = 10
; Submuestreo de la busqueda global (2 = se trabaja con bloques de 2x2 pixeles).
decimacion = 2
; Detecciones seguidas que hacen falta para pasar a SIGUIENDO.
confirmaciones = 5
; Si al buscar en toda la imagen otro candidato lejano tiene un SNR >= ambiguedad por el del
; mejor, no se engancha ninguno (mejor no medir que afirmar un blanco dudoso). 0 = sin regla.
ambiguedad = 0.6
; Cuadros perdidos seguidos antes de volver a buscar en toda la imagen.
max_fallos = 8
; Sigma (incertidumbre, en px) de la medicion cuando el SNR es alto.
sigma_px = 1.5
; Bajo este SNR, la sigma crece como snr_ref / snr...
snr_ref = 12
; ...pero nunca mas que este factor.
sigma_max_factor = 3

; Opciones de rpicam-vid del perfil: fondo oscuro, el punto destaca en el canal rojo. El
; shutter es multiplo de 10 ms (luz de 50 Hz, sin franjas) y el AWB fijo compensa el verde del
; OV5647 (base del 2026-10-27, a tunear).
camara = --shutter 10000 --gain 1 --awbgains 1.6,1.5

[barrida]
; Busqueda global periodica con retador, para los dos
; perfiles: un candidato lejano que se mueve y se confirma en n_confirmaciones barridas
; seguidas, con el blanco actual quieto, pasa a ser el blanco. false = sin barrida.
habilitada = true
; Cuadros entre barridas.
periodo_cuadros = 15
; Barridas seguidas en que debe verse el retador.
n_confirmaciones = 3
; Desplazamiento minimo (px) para considerar que algo se mueve.
umbral_movimiento = 15
; Los candidatos a menos de este radio (px) del blanco actual se ignoran.
radio_exclusion = 40
; Distancia maxima (px) entre la posicion prevista de un retador (velocidad constante entre
; barridas) y el candidato, para que sea el mismo retador.
radio_asociacion = 60
; Lo mismo en la primera asociacion, cuando aun no hay velocidad: lo que puede recorrer un
; laser movido a mano en una barrida (px).
radio_primer_salto = 200

[objeto]
; Confianza minima del adquisidor para aceptar una deteccion.
prob_min = 0.35
; Sigma de la medicion cuando el PSR del KCF esta en su valor de referencia.
sigma_px = 2.5
; Tope del crecimiento de la sigma cuando el PSR cae.
sigma_max_factor = 3
; Cuadros con el KCF perdido antes de reenganchar.
max_perdidos = 6
; Una caja a menos de estos px del borde de la imagen no se mide (el avion esta entrando o
; saliendo del cuadro y el centro de la caja no es el suyo). 0 = sin criterio: sobre la
; grabacion del 2026-10-27 no bajo la fraccion de rechazos del EKF.
margen_borde = 0
; Tamano de la caja del KCF respecto del de enganche: minimo y maximo.
kcf_escala_min = 0.4
kcf_escala_max = 2.5
; Cuadros entre verificaciones del adquisidor (0 = nunca se verifica).
periodo_verificacion = 1
; Verificaciones fallidas seguidas antes de reenganchar.
max_verif_fallidas = 3
; Superposicion (IoU) desde la que la caja del KCF se da por buena al verificar.
iou_ok = 0.5
; Centrar la ventana del KCF en la prediccion del Kalman.
centrar_con_pista = true
; Piso absoluto del PSR del KCF: por debajo, el blanco se considera perdido.
kcf_psr_umbral = 5
; Criterio relativo: el blanco se considera perdido si PSR < caida * referencia.
kcf_psr_caida = 0.32
; Lado de la plantilla del KCF, en px (mas chica = mas rapido).
kcf_plantilla = 96
; Tamano de la ventana de busqueda del KCF respecto del blanco.
kcf_padding = 2.5
; Tasa de aprendizaje del modelo del KCF.
kcf_aprendizaje = 0.012

; Adquisicion por color: exceso de rojo R - max(G, B) minimo (0 a 255) y area minima (px).
umbral_rojo = 45
area_min = 60
; Lado (px) del cierre morfologico que une las piezas de un avion con estela.
cierre = 15
; Peso del movimiento (varianza temporal) en la confianza de una mancha roja; 0 = solo color.
peso_movimiento = 0.6
; Opciones de rpicam-vid del perfil: AWB automatico, fondo bien iluminado.
camara = --ev 1
[seleccion]
; Perfil general: un KCF sobre el recuadro que se marca en el dashboard (arrastrando sobre el
; video). Sigma de la medicion con el PSR en su referencia (px) y tope de su crecimiento.
sigma_px = 2.5
sigma_max_factor = 3
; Cuadros con el KCF perdido antes de reintentar cerca de la prediccion del Kalman, y cuadros
; reintentando antes de soltar el blanco y esperar otro recuadro (90 = 3 s a 30 fps).
max_perdidos = 6
cuadros_reintento = 90
; Cuadros seguidos con el KCF confiado para volver a medir tras reintentar.
confirmaciones_reintento = 3
; Una caja a menos de estos px del borde de la imagen no se mide.
margen_borde = 4
; KCF: piso y caida relativa del PSR, plantilla (px), ventana de busqueda, aprendizaje y escala.
kcf_psr_umbral = 5
kcf_psr_caida = 0.32
kcf_plantilla = 96
kcf_padding = 2.5
kcf_aprendizaje = 0.012
kcf_escala_min = 0.4
kcf_escala_max = 2.5
; Opciones de rpicam-vid del perfil: AWB automatico.
camara = --ev 1

[lazo]
; Frecuencia del lazo (cuadros por segundo de la camara); Ts = 1/fps.
fps = 30
; Mediciones seguidas fuera de la puerta chi-cuadrado antes de pedir un reenganche.
max_rechazos = 3
; El radio de la pista es k veces la sigma de la innovacion...
k_sigma_pista = 3
; ...pero nunca menos que este radio (en px).
radio_min_pista = 20

[limites]
; Recorrido permitido de pan y de tilt (rad).
pan_min = -2.6
pan_max = 2.6
tilt_min = -1.2
tilt_max = 1.2
; Radio de la FOV util, centrado en la imagen (px).
r_fov = 180
; Aceleracion de la busqueda cuando no hay blanco (rad/s^2).
qdd_max = 15

[tiempos]
; Velocidad de la UART Pi - ESP32 (baudios) y frecuencia de la telemetria de la ESP32 (Hz).
baudios = 921600
f_telemetria = 500

[planta]
; Ejes con stepper: micropasos por eje (decision abierta: 1, 2, 4 u 8; ambos ejes van a 1/2 como
; maximo por la reduccion), torque del motor en micropasos K_m I_p (N m; en el eje se multiplica
; por la relacion), inercias vistas desde el eje (kg m^2; la del pan incluye relacion^2 por la del
; rotor), roce viscoso (N m s) y de Coulomb (N m) en el eje, carga gravitatoria del tilt m g l_cg
; (N m) y cuentas por vuelta del encoder (del motor). Inercias y roces son supuestos hasta
; identificar la planta con la transmision nueva.
micropasos_pan = 2
micropasos_tilt = 2
; Vueltas del motor por vuelta del eje: ambos ejes van con polea GT2 de 20 a 60 dientes (1:3).
; El AS5600 de cada eje va en el motor.
relacion_pan = 3
relacion_tilt = 3
Km_Ip = 0.1992
J_pan = 0.0003054
J_tilt = 0.0001054
b = 0.0001
tau_c = 0.005
mgl = 0.007848
cuentas_encoder = 4096
; Periodo del ciclo del ejecutor en la ESP32 (s).
dt_ejecutor = 0.001
; Tilt con motor (true) o sin el (false): sin motor, la ESP32 no lo mueve
; ni lee su encoder, la Pi le manda velocidad cero y el NMPC lo da por fijo en tilt_fijo (rad).
tilt_activo = false
tilt_fijo = 0

[dashboard]
; Monitor web servido por la Pi. Con habilitado = false no se levanta el servidor.
habilitado = false
; Puerto y direccion de escucha: 127.0.0.1 solo atiende a la maquina local; 0.0.0.0, a toda
; la red.
puerto = 8080
escucha = 127.0.0.1
; Pestanas simultaneas; la que sobra recibe 503.
clientes_max = 4
; Formato del video: mjpeg (h264 esta reservado y todavia no se implementa).
formato = mjpeg
; Calidad de la compresion JPEG (1 a 100).
calidad_jpeg = 80
; Tope de cuadros de video por segundo y frecuencia de los paneles de datos (Hz).
fps_max = 30
hz_paneles = 10

[vivo]
; Modo vivo: el lazo corre sobre una fuente de video en tiempo real.
; Nivel de operacion, de 0 a 4 (no confundir con general.modo).
nivel = 0
; Camara: auto (la de la Pi y, si no esta al arrancar, la USB), picam o usb. Con la USB se
; aplica [usb] y no se usan las opciones de rpicam-vid de los perfiles.
camara = auto
; Dispositivo de la camara USB; vacio = la primera webcam (/dev/v4l/by-id/*-video-index0).
usb =
; Tamano (px) y cuadros por segundo pedidos a la camara.
ancho = 640
alto = 480
fps = 30
; Pose inicial de la torreta (rad).
q0_pan = 0
q0_tilt = 0
; Latencia de captura que se supone para la fuente (s).
latencia_nominal = 0
; Duracion de la ejecucion (s); 0 = sin fin.
segundos = 0
; Si es true, se procesa un cuadro cada Ts de reloj.
tiempo_real = true
; UART hacia la ESP32 en el nivel 4 (PL011 de la Pi).
puerto = /dev/serial0

[usb]
; Lo que cambia con la webcam USB (vivo.camara). Cada linea es seccion.clave = valor y pisa a la
; de su seccion, incluso si se escribio en la linea de comandos: para cambiarla desde ahi, usar
; usb.seccion.clave=valor. Con la camara de la Pi esta seccion no se usa.
;
; Intrinsecos y obturador: por ahora, copia de los de la picam. Calibrar la webcam y
; reemplazarlos.
camara.fu = 566.59
camara.fv = 572.71
camara.cu = 307.52
camara.cv = 213.82
camara.lx = 0.02
camara.t_e = 0.01
camara.t_fila = 4.5833333333333334e-05
;
; La webcam entrega 15 fps (medido el 2026-10-28), no 30. El lazo sigue planificando sobre la
; grilla de 1/lazo.fps (la del NMPC generado y la del firmware) y el EKF usa el tiempo real, asi
; que solo cambian los parametros que cuentan cuadros para medir un tiempo; los que cuentan
; evidencia (confirmaciones, rechazos) quedan iguales.
; Fallos antes de dar el blanco por perdido: medio segundo, como los 15 a 30 fps.
ekf.max_fallos = 8
; Cuadros entre barridas: ~0,5 s, para que los radios por barrida sigan valiendo.
barrida.periodo_cuadros = 8
; Reintento del perfil general antes de soltar el blanco: 3 s.
seleccion.cuadros_reintento = 45

[ekf]
; Filtro en la pieza. perfil elige la seccion [ekf_<perfil>]; si no se escribe, sale de
; general.perfil (laser -> laser_lento, objeto -> avion).
;perfil = laser_lento
; Ruido de la pose medida por el encoder (rad).
sigma_q = 0.0005
; Modo de barrido (el segundo modo de Singer): tau_m (s) y sigma_m (rad/s^2).
tau_m_barrido = 0.3
sigma_m_barrido = 5
; Conmutacion por NIS: umbrales para subir y bajar de modo.
nis_subir = 4
nis_bajar = 2
; Factor de P de psi_dot y psi_ddot por cada rechazo, y su tope (multiplos del prior de barrido).
inflacion_fallo = 4
tope_inflacion = 10
; Rechazos seguidos para pasar al modo de barrido, y NIS con el que uno solo ya es maniobra.
confirmar_maniobra = 2
nis_maniobra = 15.2
; No salir del modo de barrido antes de llenar la ventana de NIS.
histeresis_modo = true
; Fallos seguidos antes de dar el blanco por perdido (a 30 fps, medio segundo).
max_fallos = 15
; sigma_perdido (rad): por defecto r_fov / fu; se puede fijar aqui.
;sigma_perdido = 0.36

; Perfiles del EKF: seleccion de modo (fijo, nis o imm), Singer del modo de reposo (tau_m en s,
; sigma_m en rad/s^2), Q adaptativa, permanencias del IMM (s), tratamiento de rho
; (considerado o estimado), distancia inicial al blanco (m), su incertidumbre en rho, ruido de
; proceso de rho y uso del tamano aparente.
[ekf_laser_lento]
seleccion = imm
tau_m = 0.5
sigma_m = 0.05
adaptativo = false
imm_T_reposo = 0.9
imm_T_barrido = 2.826
rho = considerado
distancia = 2
sigma_rho0 = 0.05
q_rho = 0
usar_tamano = false

[ekf_laser_rapido]
seleccion = nis
tau_m = 0.5
sigma_m = 0.05
adaptativo = false
imm_T_reposo = 0.9
imm_T_barrido = 0.5652
rho = considerado
distancia = 2
sigma_rho0 = 0.05
q_rho = 0
usar_tamano = false

[ekf_laser_brusco]
seleccion = nis
tau_m = 0.5
sigma_m = 0.05
adaptativo = false
imm_T_reposo = 0.9
imm_T_barrido = 0.15
rho = considerado
distancia = 2
sigma_rho0 = 0.05
q_rho = 0
usar_tamano = false

[ekf_avion]
seleccion = nis
tau_m = 1
sigma_m = 1.5
adaptativo = false
imm_T_reposo = 1
imm_T_barrido = 1
rho = estimado
distancia = 1.6
sigma_rho0 = 0.3
q_rho = 0.2
usar_tamano = true

[ekf_desconocido]
seleccion = fijo
tau_m = 1
sigma_m = 2
adaptativo = true
imm_T_reposo = 1
imm_T_barrido = 1
rho = considerado
distancia = 2
sigma_rho0 = 0.3
q_rho = 0
usar_tamano = false

[nmpc]
; Pesos del costo: error de imagen (px^-2), precio del desenfoque, correccion respecto del
; feedforward y su salto ((rad/s^2)^-2), y regularizacion terminal.
W_s = 1
w_p = 50
W_u = 0.01
W_delta = 0.01
eps_P = 1e-6
; FOV blanda: probabilidad de salida por lado y tope del retranqueo (px).
eps_fov = 0.01
b_max = 60
; Margen sobre el torque de pull-out y cota de q_ddot (rad/s^2, bajo ejecutor.a_lim).
eta = 0.6
u_max = 100
; Iteraciones SQP al arrancar o reenganchar.
iter_arranque = 3
; Canales de confianza: encoger psi_ddot (true/false) y psi_dot (0 no, 1 por P_psi, 2 por SNR).
confianza_a = true
confianza_v = 2
; QP de HPIPM: tope de iteraciones, modo (balance, speed, speed_abs o robust), arranque en
; caliente (0 no, 1 primales, 2 primales y duales) y bloques de condensacion.
qp_iter_max = 50
qp_modo = speed_abs
qp_arranque_caliente = 2
qp_cond_N = 2

[nmpc_solver]
; Lo usa codegen/nmpc.py al generar el solver (el periodo sale de lazo.fps). Cambiarlo exige
; volver a configurar con CMake.
; Horizonte (nodos), suavizado del signo del roce de Coulomb (rad/s) y escala del costo.
N = 10
v_s = 0.05
escala_costo = 1e-4

[comunicacion]
; Aplicacion programada (perdida.tex): t_a = t_s + delta_fb (s), nodos optimos enviados y
; nodos de la cola de feedforward.
delta_fb = 0.0045
M = 8
N_ff = 20

[ejecutor]
; Nucleo del ejecutor de la ESP32 (tambien lo usa la Pi en su espejo Phi).
; Limitador y frenado (rad/s^2), distancia a los limites de recorrido (rad), tope de velocidad
; (rad/s), correccion proporcional del DDA y su filtro (s), y observador alfa-beta.
a_lim = 120
a_frenado = 10
margen_limite = 0.05
qd_max = 2
kp = 0.2
tau_correccion = 0.05
alfa = 0.2
beta = 0.02

[esp32]
; Solo para el firmware (firmware_esp32: el script previo de PlatformIO genera config.h).
; Pines por eje: pan, tilt. El pan va en el bus I2C 33/32.
sda = 33, 21
scl = 32, 22
en = 12, 19
m0 = 14, 23
m1 = 27, 18
step = 26, 17
dir = 25, 16
uart_rx = 4
; GPIO15 es pin de arranque: con la Pi como entrada no interfiere, y lo que la ESP32 emita al
; arrancar lo descarta el lector de tramas.
uart_tx = 15
; Sentido (+1 o -1) para que DIR, encoder y q del informe tengan el mismo signo.
signo_dir = 1, 1
; El AS5600 del pan esta bajo el motor con la cara hacia arriba y DIR a tierra: crece en sentido
; horario visto desde arriba, que es -pan (la correa no invierte).
signo_enc = -1, 1
; Pasos por vuelta del motor (la relacion de transmision esta en [planta]).
pasos_vuelta = 200
; Proteccion por corriente (INA219): shunt (ohm), corriente maxima (A) y lecturas seguidas a 100 Hz.
r_shunt = 0.1
i_max = 2
n_sobrecorriente = 20
